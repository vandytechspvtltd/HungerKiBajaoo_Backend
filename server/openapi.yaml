openapi: 3.0.3
info:
  title: HungerKiBajaoo API
  description: REST API for HungerKiBajaoo food delivery application.
  version: 1.0.0
servers:
  - url: https://hungerkibajaooapi.vandytech.com
    description: Production Server
  - url: http://localhost:3000
    description: Local Development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
      required:
        - success
        - data
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
      required:
        - success
        - message
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: HungerKiBajaoo API is running
      required:
        - success
        - message
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: password
        name:
          type: string
          example: User Name
        phone:
          type: string
          example: 9999999999
      required:
        - email
        - password
        - name
        - phone
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: password
      required:
        - email
        - password
    OtpSendRequest:
      type: object
      properties:
        phone:
          type: string
          example: +919876543210
      required:
        - phone
    OtpVerifyRequest:
      type: object
      properties:
        phone:
          type: string
          example: +919876543210
        token:
          type: string
          example: 123456
      required:
        - phone
        - token
    OtpVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        access_token:
          type: string
          example: dev-abcdef123456
        refresh_token:
          type: string
          example: dev-refresh-abcdef123456
        user:
          type: object
        session:
          type: object
      required:
        - success
        - access_token
        - refresh_token
        - user
        - session
    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - refresh_token
    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
        session:
          type: object
      required:
        - success
        - access_token
        - refresh_token
        - user
        - session
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Test OTP sent successfully
      required:
        - success
        - message
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          example: User Name
        phone:
          type: string
          example: 9999999999
        profile_image:
          type: string
          example: https://example.com/image.jpg
    AddCartItemRequest:
      type: object
      properties:
        food_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
      required:
        - food_id
        - quantity
    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          example: 3
      required:
        - quantity
    CreateOrderRequest:
      type: object
      properties:
        restaurant_id:
          type: integer
          example: 1
        address_id:
          type: integer
          example: 1
        payment_method:
          type: string
          example: cod
        coupon_code:
          type: string
          example: SAVE50
      required:
        - restaurant_id
        - address_id
        - payment_method
    ValidateCouponRequest:
      type: object
      properties:
        code:
          type: string
          example: SAVE50
        cart_total:
          type: number
          example: 500
      required:
        - code
        - cart_total
    Address:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        title:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Profile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        profile_image:
          type: string
          nullable: true
        role:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Restaurant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        category:
          type: string
        image_url:
          type: string
        address:
          type: string
        phone:
          type: string
        rating:
          type: number
        is_open:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Banner:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: 50% OFF on Your First Order
        image:
          type: string
          example: https://example.com/banner.jpg
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
    Food:
      type: object
      properties:
        id:
          type: integer
        restaurant_id:
          type: integer
        category:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        is_available:
          type: boolean
        image_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Favorite:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        restaurant_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        restaurants:
          $ref: '#/components/schemas/Restaurant'
    CartItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        food_id:
          type: integer
        quantity:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        foods:
          $ref: '#/components/schemas/Food'
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        restaurant_id:
          type: integer
        address_id:
          type: integer
        total_amount:
          type: number
        payment_method:
          type: string
        payment_status:
          type: string
        order_status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        food_id:
          type: integer
        quantity:
          type: integer
        price:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        foods:
          $ref: '#/components/schemas/Food'
    Coupon:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        description:
          type: string
        discount_type:
          type: string
        discount_value:
          type: number
        maximum_discount:
          type: number
          nullable: true
        minimum_order_amount:
          type: number
          nullable: true
        usage_limit:
          type: integer
          nullable: true
        used_count:
          type: integer
        is_active:
          type: boolean
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Offer:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
        is_active:
          type: boolean
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeliveryPartner:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        vehicle_number:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderAssignment:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        delivery_partner_id:
          type: integer
        assigned_at:
          type: string
          format: date-time
        picked_up_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
    RestaurantOwner:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
        restaurant_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
paths:
  /api/health:
    get:
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation or registration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      summary: User login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/refresh-token:
    post:
      summary: Refresh an access token using a valid refresh token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Missing or invalid refresh token request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/send-otp:
    post:
      summary: Send a development-only test OTP to a phone number
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '200':
          description: Test OTP sent successfully in development mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Endpoint unavailable in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/verify-otp:
    post:
      summary: Verify a development-only OTP and authenticate the user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Endpoint unavailable in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      summary: Logout current user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/account:
    delete:
      summary: Delete the authenticated user account
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to delete account or account data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/me:
    get:
      summary: Get current user profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/profile:
    get:
      summary: Get authenticated user profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update authenticated user profile
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error or no data provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/restaurants:
    get:
      summary: List restaurants
      tags:
        - Restaurants
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: is_open
          schema:
            type: boolean
      responses:
        '200':
          description: Restaurants returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/restaurants/{id}:
    get:
      summary: Get restaurant by ID
      tags:
        - Restaurants
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/restaurants/{id}/menu:
    get:
      summary: Get restaurant menu
      tags:
        - Restaurants
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Restaurant menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/categories:
    get:
      summary: List categories
      tags:
        - Categories
      responses:
        '200':
          description: Categories returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/categories/{id}/foods:
    get:
      summary: Get foods by category ID
      tags:
        - Categories
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category and foods returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/banners:
    get:
      summary: List active banners
      tags:
        - Banners
      responses:
        '200':
          description: Active banners returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Failed to fetch banners
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /api/foods:
    get:
      summary: List foods
      tags:
        - Foods
      parameters:
        - in: query
          name: restaurant_id
          schema:
            type: integer
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: is_available
          schema:
            type: boolean
      responses:
        '200':
          description: Foods returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/foods/{id}:
    get:
      summary: Get food by ID
      tags:
        - Foods
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Food item returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Food item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/favorites:
    get:
      summary: List user favorites
      tags:
        - Favorites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Favorites returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/favorites/{restaurantId}:
    post:
      summary: Add a restaurant to favorites
      tags:
        - Favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Favorite added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Already favorited or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a restaurant from favorites
      tags:
        - Favorites
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Favorite removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/addresses:
    get:
      summary: List user addresses
      tags:
        - Addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Addresses returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    post:
      summary: Create an address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Home
                address:
                  type: string
                  example: 123 Main St
                latitude:
                  type: number
                  example: 12.9716
                longitude:
                  type: number
                  example: 77.5946
                is_default:
                  type: boolean
                  example: true
              required:
                - title
                - address
                - latitude
                - longitude
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/addresses/{id}:
    patch:
      summary: Update an address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
